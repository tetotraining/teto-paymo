name: Check Paymo Cloudflare deploy capability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-capability.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configured Cloudflare credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "PAYMO_CLOUDFLARE_CREDENTIALS=available"
            exit 0
          fi
          echo "PAYMO_CLOUDFLARE_CREDENTIALS=missing"
          exit 2
