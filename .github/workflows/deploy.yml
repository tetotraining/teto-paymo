name: Verify Paymo Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - 'functions/**'
      - 'paymo-*.js'
      - '.github/workflows/deploy.yml'

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare Pages production matches main
        shell: bash
        run: |
          set -e
          expected="$(sha256sum paymo-design.js | awk '{print $1}')"
          echo "expected=$expected"
          for i in $(seq 1 30); do
            ts=$(date +%s)
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-design.js?ts=$ts" -o /tmp/paymo-design.js || true
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/?ts=$ts" -o /tmp/paymo-index.html || true
            if [ -s /tmp/paymo-design.js ] && [ -s /tmp/paymo-index.html ]; then
              actual="$(sha256sum /tmp/paymo-design.js | awk '{print $1}')"
              echo "attempt=$i actual=$actual"
              if [ "$actual" = "$expected" ] \
                && grep -q 'paymo-status-safe-area-style' /tmp/paymo-index.html \
                && grep -q 'apple-mobile-web-app-status-bar-style" content="black-translucent' /tmp/paymo-index.html; then
                echo "Cloudflare Pages production matches latest Paymo code and iOS top safe-area theme sync is live."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Cloudflare Pages production has not picked up the latest Paymo deployment."
          exit 1
