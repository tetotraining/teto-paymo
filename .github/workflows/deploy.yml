name: Verify Paymo Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - 'functions/**'
      - 'paymo-*.js'
      - 'deploy-marker.txt'
      - '.github/workflows/deploy.yml'

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Cloudflare Pages production
        shell: bash
        run: |
          set -e
          expected='paymo-20261030-1804'
          for i in $(seq 1 30); do
            body="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/deploy-marker.txt?ts=$(date +%s)" || true)"
            echo "attempt=$i body=$body"
            if [ "$body" = "$expected" ]; then
              echo "Cloudflare Pages production is serving the latest Paymo deployment."
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Pages production is not serving the latest Paymo deployment."
          exit 1
