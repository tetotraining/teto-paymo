name: Verify Paymo Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - 'functions/**'
      - 'paymo-*.js'
      - '.github/workflows/deploy.yml'

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare Pages production matches main
        shell: bash
        run: |
          set -e
          expected_design="$(sha256sum paymo-design.js | awk '{print $1}')"
          expected_ios="$(sha256sum paymo-ios-theme-sync.js | awk '{print $1}')"
          expected_history="$(sha256sum paymo-history-edit.js | awk '{print $1}')"
          echo "expected_design=$expected_design"
          echo "expected_ios=$expected_ios"
          echo "expected_history=$expected_history"
          for i in $(seq 1 30); do
            ts=$(date +%s)
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-design.js?ts=$ts" -o /tmp/paymo-design.js || true
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-ios-theme-sync.js?ts=$ts" -o /tmp/paymo-ios-theme-sync.js || true
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-history-edit.js?ts=$ts" -o /tmp/paymo-history-edit.js || true
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/?ts=$ts" -o /tmp/paymo-index.html || true
            if [ -s /tmp/paymo-design.js ] && [ -s /tmp/paymo-ios-theme-sync.js ] && [ -s /tmp/paymo-history-edit.js ] && [ -s /tmp/paymo-index.html ]; then
              actual_design="$(sha256sum /tmp/paymo-design.js | awk '{print $1}')"
              actual_ios="$(sha256sum /tmp/paymo-ios-theme-sync.js | awk '{print $1}')"
              actual_history="$(sha256sum /tmp/paymo-history-edit.js | awk '{print $1}')"
              echo "attempt=$i design=$actual_design ios=$actual_ios history=$actual_history"
              if [ "$actual_design" = "$expected_design" ] \
                && [ "$actual_ios" = "$expected_ios" ] \
                && [ "$actual_history" = "$expected_history" ] \
                && grep -q '/paymo-ios-theme-sync.js' /tmp/paymo-index.html \
                && grep -q 'apple-mobile-web-app-status-bar-style" content="default' /tmp/paymo-index.html; then
                echo "Cloudflare Pages production matches the latest Paymo code, including history click mapping."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Cloudflare Pages production has not picked up the latest Paymo code."
          exit 1
