name: Verify Paymo Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - 'functions/**'
      - 'paymo-*.js'
      - '.github/workflows/deploy.yml'

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare Pages production matches main
        shell: bash
        run: |
          set -e
          expected="$(sha256sum paymo-design.js | awk '{print $1}')"
          echo "expected=$expected"
          for i in $(seq 1 30); do
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://teto-paymo.pages.dev/paymo-design.js?ts=$(date +%s)" -o /tmp/paymo-design.js || true
            if [ -s /tmp/paymo-design.js ]; then
              actual="$(sha256sum /tmp/paymo-design.js | awk '{print $1}')"
              echo "attempt=$i actual=$actual"
              if [ "$actual" = "$expected" ]; then
                echo "Cloudflare Pages production matches the latest Paymo design code."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Cloudflare Pages production does not match the latest Paymo design code."
          exit 1
