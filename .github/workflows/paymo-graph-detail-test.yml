name: Test Paymo Graph Detail Buttons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paymo-graph-detail.js'
      - 'app/public/paymo-graph-detail.js'
      - 'paymo-graph-detail-edit.js'
      - 'app/public/paymo-graph-detail-edit.js'
      - 'tests/paymo-billing-graph-detail.mjs'
      - '.github/workflows/paymo-graph-detail-test.yml'
jobs:
  browser-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm mirrored files and JS syntax
        run: |
          cmp paymo-graph-detail.js app/public/paymo-graph-detail.js
          cmp paymo-graph-detail-edit.js app/public/paymo-graph-detail-edit.js
          node --check paymo-graph-detail.js
          node --check paymo-graph-detail-edit.js
          node --check tests/paymo-billing-graph-detail.mjs
      - name: Install no-cost test dependency
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Browser regression for monthly billing vs usage trend
        run: node tests/paymo-billing-graph-detail.mjs
      - name: Verify the production graph scripts match GitHub
        shell: bash
        run: |
          set -euo pipefail
          for file in paymo-graph-detail.js paymo-graph-detail-edit.js; do
            expected="$(sha256sum "app/public/$file" | cut -d ' ' -f1)"
            matched=0
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' \
                "https://teto-paymo.pages.dev/$file?build=$GITHUB_SHA&attempt=$attempt" -o "/tmp/$file"; then
                actual="$(sha256sum "/tmp/$file" | cut -d ' ' -f1)"
                if [ "$actual" = "$expected" ]; then
                  matched=1
                  echo "Production confirmed: $file SHA-256 $actual"
                  break
                fi
              fi
              sleep 4
            done
            if [ "$matched" != 1 ]; then
              echo "::error::Paymo production graph asset differs: $file"
              exit 1
            fi
          done
