name: Test Paymo Sliding Pill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paymo-sliding-pill.js'
      - 'paymo-sliding-pill.css'
      - 'app/public/paymo-sliding-pill.js'
      - 'app/public/paymo-sliding-pill.css'
      - 'paymo-nav-scroll-top.js'
      - 'tests/paymo-sliding-pill.mjs'
      - '.github/workflows/paymo-sliding-pill.yml'

jobs:
  sliding-pill-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mirrored assets and JavaScript syntax
        run: |
          cmp paymo-sliding-pill.js app/public/paymo-sliding-pill.js
          cmp paymo-sliding-pill.css app/public/paymo-sliding-pill.css
          node --check app/public/paymo-sliding-pill.js
          node --check tests/paymo-sliding-pill.mjs
      - name: Install free browser test runtime
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Exercise Sliding Pill interactions in Chromium
        run: node tests/paymo-sliding-pill.mjs
