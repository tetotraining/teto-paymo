name: Test Paymo Spending Alert Settings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paymo-spending-threshold.js'
      - 'app/public/paymo-spending-threshold.js'
      - 'tests/paymo-spending-threshold.mjs'
      - '.github/workflows/paymo-spending-threshold.yml'
jobs:
  browser-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check mirrored files and syntax
        run: |
          cmp paymo-spending-threshold.js app/public/paymo-spending-threshold.js
          node --check paymo-spending-threshold.js
          node --check tests/paymo-spending-threshold.mjs
      - name: Install free browser testing runtime
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Run browser settings regression
        run: node tests/paymo-spending-threshold.mjs
      - name: Check production feature availability (informational)
        if: always()
        shell: bash
        run: |
          for path in /paymo-spending-threshold.js /api/spending-threshold-settings; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://teto-paymo.pages.dev$path" || true)"
            echo "production $path HTTP $code"
          done
          echo "Testing existing backend route (OPTIONS distinguishes deployed threshold module from legacy API):"
          threshold_options="$(curl -sS -X OPTIONS -o /tmp/paymo-threshold-options -w '%{http_code}' --max-time 15 https://teto-paymo.pages.dev/api/spending-threshold-settings || true)"
          echo "threshold OPTIONS HTTP $threshold_options"
          if [ "$threshold_options" = '204' ]; then
            echo "::warning::Production API is missing the threshold route; backend Worker requires deployment."
          elif [ "$threshold_options" = '401' ]; then
            echo "Threshold route may be installed (authentication required); confirm actual authenticated save separately."
          fi
          expected="$(sha256sum app/public/paymo-spending-threshold.js | awk '{print $1}')"
          curl -fLsS -H 'Cache-Control: no-cache' --max-time 15 "https://teto-paymo.pages.dev/paymo-spending-threshold.js?revision=$GITHUB_SHA" -o /tmp/paymo-spending-threshold.js || true
          if [ -s /tmp/paymo-spending-threshold.js ]; then
            actual="$(sha256sum /tmp/paymo-spending-threshold.js | awk '{print $1}')"
            if [ "$actual" = "$expected" ]; then
              echo "production spending threshold JS matches this commit"
            else
              echo "::warning::production spending threshold JS differs from main (deployment pending)"
            fi
          else
            echo "::warning::production spending threshold JS not accessible"
          fi
